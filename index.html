.toast.success{border-left-color:var(--success)}

.empty-state h3{font-size:18px;margin-bottom:8px;color:var(--text-primary)}
.empty-state p{font-size:14px;margin-bottom:20px}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary);padding:20px}
.login-box{background:var(--bg-card);border-radius:var(--radius);padding:40px;box-shadow:var(--shadow-hover);width:100%;max-width:400px;text-align:center}
.login-box h1{font-size:24px;margin-bottom:8px;color:var(--accent)}
.login-box p{color:var(--text-secondary);margin-bottom:24px;font-size:14px}
.login-box .form-field{text-align:left;margin-bottom:14px}
.login-box .btn-primary{width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:8px}

.loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary);flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-secondary);font-size:14px}
@media(max-width:768px){.app-header{flex-wrap:wrap;padding:10px}.app-logo{font-size:16px}.search-box{order:3;max-width:100%;flex-basis:100%}.header-actions .btn span{display:none}.app-nav{padding:8px 10px}.view-tab,.filter-btn{font-size:11px;padding:5px 8px}.app-main{padding:12px}.column{min-width:260px;width:260px}.form-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.calendar-cell{min-height:50px}.calendar-renewal{font-size:9px}.pipeline-label{width:120px;font-size:11px}}
::-webkit-scrollbar{width:8px;height:8px}

::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
</style>

const L={
  stage(id){return STAGES.find(s=>s.id===id)||STAGES[0]},
  pct(r){if(!r.expiring_premium||!r.offered_premium)return null;return((r.offered_premium-r.expiring_premium)/r.expiring_premium)*100},
  daysInStage(r){const logs=App.state.activityLogs[r.id]||[];const sc=logs.filter(l=>l.action==="Stage changed").pop();if(!sc)return U.daysSince(r.created_at?new Date(r.created_at).toISOString():null);return U.daysSince(new Date(sc.created_at).toISOString())},
  daysSinceLate(r){if(!r.late_requirement_flag||!r.late_req_date)return 0;return U.daysSince(r.late_req_date)},
  priority(r){if(TERMINAL.includes(r.current_stage))return 0;if(r.owner==="Producer-Handled")return 0;let s=0;const d=U.daysUntil(r.renewal_date);if(d===null)s+=15;else if(d<0)s+=100;else if(d<7)s+=90;else if(d<14)s+=75;else if(d<30)s+=60;else if(d<60)s+=35;else s+=15;s+=Math.min(L.daysInStage(r)*5,50);const p=L.pct(r);if(p!==null){if(p>20)s+=30;else if(p>10)s+=20;else s+=5}if(r.late_requirement_flag)s+=Math.min(L.daysSinceLate(r)*15,40);if(r.current_stage==="presented"&&r.date_presented){const ds=U.daysSince(r.date_presented);const sig=["Signed Online","Signed In-Person"].includes(r.signature_status);const paid=r.payment_status==="Received"||r.mortgage_billed;if(ds>3&&(!sig||!paid))s+=30}return s},
  shouldFollowUp(r){if(r.current_stage!=="presented")return false;const sig=["Signed Online","Signed In-Person"].includes(r.signature_status);const paid=r.payment_status==="Received"||r.mortgage_billed;if(sig&&paid)return false;if(!r.date_presented)return false;return U.daysSince(r.date_presented)>=(App.state.settings.follow_up_days||3)},
  tenPctWarn(r){const p=L.pct(r);return p!==null&&p>=10&&r.decision==="Renew Incumbent"&&!r.override_reason},
  filter(renewals){let res=renewals.filter(r=>!TERMINAL.includes(r.current_stage));const q=App.state.searchQuery.toLowerCase().trim();if(q)res=res.filter(r=>Object.values(r).some(v=>typeof v==="string"&&v.toLowerCase().includes(q)));const f=App.state.activeFilter;if(f==="late")res=res.filter(r=>{const d=U.daysUntil(r.renewal_date);return(r.current_stage==="awaiting_offer"&&d!==null&&d<=30)||r.late_requirement_flag});else if(f==="postbind")res=res.filter(r=>r.current_stage==="post_bind"&&!r.financial_packet_sent);else if(f==="followup")res=res.filter(r=>L.shouldFollowUp(r));else if(f==="mypipeline")res=res.filter(r=>r.owner==="Me");return res},
  topPriorities(n=5){return App.state.renewals.map(r=>({...r,_s:L.priority(r)})).filter(r=>r._s>0).sort((a,b)=>b._s-a._s).slice(0,n)},
  priorityReasons(r){const reasons=[];const d=U.daysUntil(r.renewal_date);if(d!==null){if(d<0)reasons.push(`OVERDUE by ${Math.abs(d)} days`);else if(d<30)reasons.push(`Expires in ${d} days`)}const dis=L.daysInStage(r);if(dis>5)reasons.push(`In "${L.stage(r.current_stage).label}" for ${dis} days`);if(r.late_requirement_flag)reasons.push(`Late requirement ${L.daysSinceLate(r)} day(s) ago`);const p=L.pct(r);if(p!==null&&p>=10)reasons.push(`Premium increase ${p.toFixed(1)}%`);if(L.shouldFollowUp(r))reasons.push(`Unresponsive for ${U.daysSince(r.date_presented)} days`);return reasons}
};

const DB={
  async fetchAll(){
    const uid=App.user.id;

      sb.from("renewals").select("*").eq("user_id",uid).order("renewal_date",{ascending:true}),
      sb.from("activity_logs").select("*").eq("user_id",uid).order("created_at",{ascending:true}),
      sb.from("user_settings").select("*").eq("user_id",uid).single(),
      sb.from("email_templates").select("*").eq("user_id",uid)
    ]);
    if(e1)console.error("Fetch renewals error:",e1);
    if(e2)console.error("Fetch logs error:",e2);
    App.state.renewals=renewals||[];
    const logMap={};
    (logs||[]).forEach(l=>{if(!logMap[l.renewal_id])logMap[l.renewal_id]=[];logMap[l.renewal_id].push(l)});
    App.state.activityLogs=logMap;
    if(settings)App.state.settings={...App.state.settings,...settings};
    App.state.templates=templates||[];
    if(App.state.templates.length===0)await DB.seedTemplates();
  },
  async seedTemplates(){

    const{data,error}=await sb.from("email_templates").insert(toInsert).select();
    if(!error)App.state.templates=data||[];
  },
  async addRenewal(data){
    const uid=App.user.id;
    const renewal={...data,user_id:uid,id:U.uuid(),created_at:new Date().toISOString(),updated_at:new Date().toISOString(),date_assigned:new Date().toISOString().split("T")[0]};
    const{error}=await sb.from("renewals").insert(renewal);
    if(error){UI.toast("Failed to save: "+error.message,"error");return null}
    await DB.logActivity(renewal.id,"Created",`Renewal created for ${renewal.insured_name}`);
    App.state.renewals.push(renewal);
    return renewal;
  },
  async updateRenewal(id,changes){
    const old=App.state.renewals.find(r=>r.id===id);
    const oldStage=old?old.current_stage:null;
    const{error}=await sb.from("renewals").update(changes).eq("id",id);
    if(error){UI.toast("Failed to save: "+error.message,"error");return}
    Object.assign(old,changes,{updated_at:new Date().toISOString()});
    if(changes.current_stage&&changes.current_stage!==oldStage){
      const ns=L.stage(changes.current_stage);
      old.next_action=ns.defaultAction;
      old.ezlynx_updated=false;
      await DB.logActivity(id,"Stage changed",`${L.stage(oldStage).label} → ${ns.label}`);
    }
    if(changes.late_requirement_flag&&!old.late_req_date){
      old.late_req_date=new Date().toISOString().split("T")[0];
      await sb.from("renewals").update({late_req_date:old.late_req_date}).eq("id",id);
    }
  },
  async deleteRenewal(id){
    const r=App.state.renewals.find(r=>r.id===id);
    const{error}=await sb.from("renewals").delete().eq("id",id);

    App.state.renewals=App.state.renewals.filter(r=>r.id!==id);

  },
  async logActivity(renewalId,action,details=""){

    if(!error){if(!App.state.activityLogs[renewalId])App.state.activityLogs[renewalId]=[];App.state.activityLogs[renewalId].push(entry)}
  },
  async updateSettings(changes){

    await sb.from("user_settings").upsert({user_id:App.user.id,...App.state.settings});
  },
  async exportBackup(){

    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`es-renewals-backup-${new Date().toISOString().split("T")[0]}.json`;a.click();URL.revokeObjectURL(url);UI.toast("Backup downloaded","success");
  },
  async importBackup(file){

    reader.onload=async(e)=>{
      try{
        const data=JSON.parse(e.target.result);

      }catch(err){UI.toast("Import failed: "+err.message,"error")}
    };
    reader.readAsText(file);
  },
  async importCSV(file){
    const reader=new FileReader();
    reader.onload=async(e)=>{
      try{
        const text=e.target.result;const rows=text.split(/\r?\n/).filter(r=>r.trim());

        }
        const{error}=await sb.from("renewals").insert(newR);
        if(error)throw error;
        await DB.fetchAll();UI.renderAll();
        UI.toast(`Imported ${newR.length} renewals from CSV`,"success");
      }catch(err){UI.toast("CSV import failed: "+err.message,"error")}
    };
    reader.readAsText(file);
  }
};

    const d=App.state.calendarDate,y=d.getFullYear(),m=d.getMonth();const fd=new Date(y,m,1),ld=new Date(y,m+1,0);const dim=ld.getDate(),sdow=fd.getDay();const mn=d.toLocaleDateString("en-US",{month:"long",year:"numeric"});
    const renewals=App.state.renewals.filter(r=>r.renewal_date&&!TERMINAL.includes(r.current_stage));
    let html=`<div class="calendar-container"><div class="calendar-header"><button class="btn btn-secondary" id="cal-prev">← Prev</button><h2 class="calendar-title">${mn}</h2><button class="btn btn-secondary" id="cal-next">Next →</button></div><div class="calendar-grid">`;
    ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{html+=`<div class="calendar-day-header">${d}</div>`});
    for(let i=0;i<sdow;i++)html+=`<div class="calendar-cell other-month"></div>`;
    const today=U.today();
    for(let day=1;day<=dim;day++){const date=new Date(y,m,day);const ds=date.toISOString().split("T")[0];const dr=renewals.filter(r=>r.renewal_date===ds);const isT=date.getTime()===today.getTime();let cc="calendar-cell";if(isT)cc+=" today";if(dr.length)cc+=" has-renewals";
    html+=`<div class="${cc}" data-date="${ds}"><div class="calendar-date">${day}</div>${dr.slice(0,3).map(r=>{const st=L.stage(r.current_stage);return`<div class="calendar-renewal" style="background:${st.color}" data-id="${r.id}" title="${U.esc(r.insured_name)}">${U.esc(r.insured_name)}</div>`}).join("")}${dr.length>3?`<div style="font-size:10px;color:var(--text-secondary)">+${dr.length-3} more</div>`:""}</div>`}
    return html+"</div></div>";
  },
  renderStats(){
    const all=App.state.renewals;const active=all.filter(r=>!TERMINAL.includes(r.current_stage)&&r.owner==="Me");
    const cr=all.filter(r=>r.current_stage==="closed_renewed").length;const cn=all.filter(r=>r.current_stage==="closed_not_renewed").length;const tc=cr+cn;const rr=tc>0?((cr/tc)*100).toFixed(0):"—";
    const lc=L.filter(all).filter(r=>{const d=U.daysUntil(r.renewal_date);return(r.current_stage==="awaiting_offer"&&d!==null&&d<=30)||r.late_requirement_flag}).length;
    const pbc=all.filter(r=>r.current_stage==="post_bind"&&!r.financial_packet_sent).length;
    const top=L.topPriorities(5);const max=Math.max(...STAGES.map(s=>active.filter(r=>r.current_stage===s.id).length),1);
    return`<div class="stats-grid"><div class="stat-card"><div class="stat-label">Active Renewals</div><div class="stat-value">${active.length}</div></div><div class="stat-card danger"><div class="stat-label">Late / At-Risk</div><div class="stat-value">${lc}</div></div><div class="stat-card warning"><div class="stat-label">Stuck Post-Bind</div><div class="stat-value">${pbc}</div></div><div class="stat-card success"><div class="stat-label">Retention Rate</div><div class="stat-value">${rr}${rr!=="—"?"%":""}</div></div></div>
    <div class="stats-section"><h3>🎯 Top Priorities</h3>${top.length===0?`<p style="color:var(--text-secondary);font-size:13px">No urgent items!</p>`:`<ul class="priority-list">${top.map((r,i)=>`<li class="priority-item" data-id="${r.id}"><span class="priority-rank">${i+1}</span><div class="priority-title">${U.esc(r.insured_name)}</div><div class="priority-reasons">${L.priorityReasons(r).map(x=>"• "+U.esc(x)).join(" | ")}</div></li>`).join("")}</ul>`}</div>
    <div class="stats-section"><h3>📊 Pipeline Distribution</h3>${STAGES.map(s=>{const c=active.filter(r=>r.current_stage===s.id).length;const p=(c/max)*100;return`<div class="pipeline-bar"><div class="pipeline-label">${s.label}</div><div class="pipeline-track"><div class="pipeline-fill" style="width:${p}%;background:${s.color}">${c||""}</div></div><div class="pipeline-count">${c}</div></div>`}).join("")}</div>`;
  },
  attachViewEvents(){
    document.querySelectorAll(".card[draggable]").forEach(card=>{card.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",card.dataset.id);card.classList.add("dragging")});card.addEventListener("dragend",()=>card.classList.remove("dragging"));card.addEventListener("click",()=>UI.openEditModal(card.dataset.id))});
    document.querySelectorAll(".column-body").forEach(col=>{col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drag-over")});col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));col.addEventListener("drop",async e=>{e.preventDefault();col.classList.remove("drag-over");const id=e.dataTransfer.getData("text/plain");await Act.updateRenewal(id,{current_stage:col.dataset.stage});UI.toast("Stage updated","success")})});
    document.querySelectorAll(".list-table tbody tr").forEach(row=>{row.addEventListener("click",()=>UI.openEditModal(row.dataset.id))});
    document.querySelectorAll(".list-table th[data-sort]").forEach(th=>{th.addEventListener("click",()=>{const f=th.dataset.sort;if(App.state.sortField===f)App.state.sortDir=App.state.sortDir==="asc"?"desc":"asc";else{App.state.sortField=f;App.state.sortDir="asc"}UI.renderView()})});
    const cp=document.getElementById("cal-prev"),cn=document.getElementById("cal-next");
    if(cp)cp.addEventListener("click",()=>{App.state.calendarDate=new Date(App.state.calendarDate.getFullYear(),App.state.calendarDate.getMonth()-1,1);UI.renderView()});
    if(cn)cn.addEventListener("click",()=>{App.state.calendarDate=new Date(App.state.calendarDate.getFullYear(),App.state.calendarDate.getMonth()+1,1);UI.renderView()});
    document.querySelectorAll(".calendar-renewal").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();UI.openEditModal(el.dataset.id)})});
    document.querySelectorAll(".priority-item").forEach(el=>{el.addEventListener("click",()=>UI.openEditModal(el.dataset.id))});
  },
  openEditModal(id){
    const r=App.state.renewals.find(r=>r.id===id);if(!r)return;
    const p=L.pct(r);const pd=p!==null?p.toFixed(1)+"%":"—";const w=L.tenPctWarn(r);
    const logs=(App.state.activityLogs[id]||[]).slice().reverse();
    const html=`<div class="modal-overlay" id="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>${U.esc(r.insured_name)}</h2><button class="modal-close" data-action="close">×</button></div><div class="modal-body">
    <div class="modal-tabs"><button class="modal-tab active" data-tab="core">Core</button><button class="modal-tab" data-tab="fin">Financials</button><button class="modal-tab" data-tab="client">Client</button><button class="modal-tab" data-tab="post">Post-Bind</button><button class="modal-tab" data-tab="rem">Remarketing</button><button class="modal-tab" data-tab="act">Activity</button></div>
    <div class="tab-content active" data-tab="core"><div class="form-grid">
      <div class="form-field full"><label>Insured Name</label><input type="text" data-field="insured_name" value="${U.esc(r.insured_name)}"></div>
      <div class="form-field"><label>Coverage Type</label><input type="text" data-field="coverage_type" value="${U.esc(r.coverage_type)}"></div>
      <div class="form-field"><label>Renewal Date</label><input type="date" data-field="renewal_date" value="${r.renewal_date||""}"></div>
      <div class="form-field"><label>Owner</label><select data-field="owner"><option value="Me" ${r.owner==="Me"?"selected":""}>Me</option><option value="Producer-Handled" ${r.owner==="Producer-Handled"?"selected":""}>Producer-Handled</option></select></div>
      <div class="form-field"><label>Broker</label><input type="text" data-field="broker_name" value="${U.esc(r.broker_name)}"></div>
      <div class="form-field"><label>Stage</label><select data-field="current_stage">${STAGES.map(s=>`<option value="${s.id}" ${r.current_stage===s.id?"selected":""}>${s.label}</option>`).join("")}</select></div>
      <div class="form-field"><label>Offer Location</label><select data-field="last_known_offer_location">${["Unknown","My Inbox","Rui","Chris","Andrea","Broker"].map(o=>`<option ${r.last_known_offer_location===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div class="form-field full"><label>Next Action</label><input type="text" data-field="next_action" value="${U.esc(r.next_action)}"></div>
    </div></div>
    <div class="tab-content" data-tab="fin"><div class="form-grid">
      <div class="form-field"><label>Expiring Premium</label><input type="number" step="0.01" data-field="expiring_premium" value="${r.expiring_premium||""}"></div>
      <div class="form-field"><label>Offered Premium</label><input type="number" step="0.01" data-field="offered_premium" value="${r.offered_premium||""}"></div>
      <div class="form-field"><label>Premium Change % (auto)</label><input type="text" value="${pd}" readonly></div>
      <div class="form-field"><label>Decision</label><select data-field="decision"><option value="Pending" ${r.decision==="Pending"?"selected":""}>Pending</option><option value="Renew Incumbent" ${r.decision==="Renew Incumbent"?"selected":""}>Renew Incumbent</option><option value="Remarket" ${r.decision==="Remarket"?"selected":""}>Remarket</option></select></div>
      <div class="form-field"><label>Expiring Deductible</label><input type="text" data-field="expiring_deductible" value="${U.esc(r.expiring_deductible)}"></div>
      <div class="form-field"><label>Offered Deductible</label><input type="text" data-field="offered_deductible" value="${U.esc(r.offered_deductible)}"></div>
      <div class="form-field full"><label>Key Coverage Changes / Exclusions</label><textarea data-field="key_coverage_changes">${U.esc(r.key_coverage_changes)}</textarea></div>
      <div class="form-field full"><label>Override Reason</label><textarea data-field="override_reason">${U.esc(r.override_reason)}</textarea>${w?`<div class="warning-box">⚠️ Premium increase ≥10% with "Renew Incumbent". Please document your override reason.</div>`:""}</div>
    </div></div>
    <div class="tab-content" data-tab="client"><div class="form-grid">
      <div class="form-field"><label>Date Presented</label><input type="date" data-field="date_presented" value="${r.date_presented||""}"></div>
      <div class="form-field"><label>Signature Status</label><select data-field="signature_status">${["Not Sent","Sent","Signed Online","Signed In-Person"].map(o=>`<option ${r.signature_status===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div class="form-field"><label>Payment Status</label><select data-field="payment_status">${["Not Received","Received"].map(o=>`<option ${r.payment_status===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div class="form-field"><div class="checkbox-field"><input type="checkbox" id="mb" data-field="mortgage_billed" ${r.mortgage_billed?"checked":""}><label for="mb">Mortgage-Billed</label></div></div>
      <div class="form-field full"><label>Financing Checklist (FIF)</label><textarea data-field="financing_checklist">${U.esc(r.financing_checklist)}</textarea></div>
    </div></div>
    <div class="tab-content" data-tab="post"><div class="form-grid">
      <div class="form-field"><div class="checkbox-field"><input type="checkbox" id="br" data-field="binder_received" ${r.binder_received?"checked":""}><label for="br">Binder Received</label></div></div>
      <div class="form-field"><div class="checkbox-field"><input type="checkbox" id="ir" data-field="invoice_received" ${r.invoice_received?"checked":""}><label for="ir">Invoice Received</label></div></div>
      <div class="form-field"><div class="checkbox-field"><input type="checkbox" id="lrf" data-field="late_requirement_flag" ${r.late_requirement_flag?"checked":""}><label for="lrf">Late Requirement Flag</label></div></div>
      <div class="form-field"><label>Late Req. Date</label><input type="date" data-field="late_req_date" value="${r.late_req_date||""}"></div>
      <div class="form-field"><div class="checkbox-field"><input type="checkbox" id="eu" data-field="ezlynx_updated" ${r.ezlynx_updated?"checked":""}><label for="eu">EZLynx Updated</label></div></div>
      <div class="form-field"><div class="checkbox-field"><input type="checkbox" id="fps" data-field="financial_packet_sent" ${r.financial_packet_sent?"checked":""}><label for="fps">Financial Packet Sent to Chris</label></div></div>
    </div></div>
    <div class="tab-content" data-tab="rem"><div class="form-field full"><label>Remarketing Log</label><textarea data-field="remarketing_log" rows="10">${U.esc(r.remarketing_log)}</textarea></div></div>
    <div class="tab-content" data-tab="act"><div class="form-field full" style="margin-bottom:20px"><label>Notes</label><textarea data-field="notes" rows="4">${U.esc(r.notes)}</textarea></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase">Activity Timeline</label><button class="btn btn-secondary btn-icon" id="btn-log-act">+ Log Activity</button></div>
      ${logs.length===0?`<p style="color:var(--text-secondary);font-size:13px">No activity logged.</p>`:`<ul class="timeline">${logs.map(l=>`<li class="timeline-item"><div class="timeline-date">${U.fmtDT(l.created_at)}</div><div class="timeline-action">${U.esc(l.action)}</div>${l.details?`<div class="timeline-details">${U.esc(l.details)}</div>`:""}</li>`).join("")}</ul>`}
    </div>
    </div><div class="modal-footer"><button class="btn btn-danger" data-action="delete">Delete</button><button class="btn btn-secondary" data-action="close">Cancel</button><button class="btn btn-primary" data-action="save">Save</button></div></div></div>`;
    document.getElementById("modal-root").innerHTML=html;
    const ov=document.getElementById("modal-overlay");
    ov.addEventListener("click",e=>{if(e.target===ov)UI.closeModal()});
    ov.querySelectorAll("[data-action='close']").forEach(b=>b.addEventListener("click",UI.closeModal));
    ov.querySelectorAll("[data-action='delete']").forEach(b=>b.addEventListener("click",async()=>{if(confirm("Delete this renewal?")){await Act.deleteRenewal(id);UI.closeModal()}}));
    ov.querySelectorAll("[data-action='save']").forEach(b=>b.addEventListener("click",async()=>{const ch={};ov.querySelectorAll("[data-field]").forEach(el=>{const f=el.dataset.field;if(el.type==="checkbox")ch[f]=el.checked;else if(el.type==="number")ch[f]=parseFloat(el.value)||0;else ch[f]=el.value});await Act.updateRenewal(id,ch);UI.closeModal();UI.toast("Saved","success")}));
    ov.querySelectorAll(".modal-tab").forEach(tab=>{tab.addEventListener("click",()=>{ov.querySelectorAll(".modal-tab").forEach(t=>t.classList.remove("active"));ov.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));tab.classList.add("active");ov.querySelector(`.tab-content[data-tab="${tab.dataset.tab}"]`).classList.add("active")})});
    const lb=ov.querySelector("#btn-log-act");if(lb)lb.addEventListener("click",async()=>{const action=prompt("Activity (e.g., 'Email sent to broker'):");if(action){const details=prompt("Details (optional):")||"";await DB.logActivity(id,action,details);UI.closeModal();UI.openEditModal(id);UI.toast("Activity logged","success")}});
  },
  openNewModal(){
    const html=`<div class="modal-overlay" id="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>New Renewal</h2><button class="modal-close" data-action="close">×</button></div><div class="modal-body"><div class="form-grid">
      <div class="form-field full"><label>Insured Name *</label><input type="text" data-field="insured_name" required></div>
      <div class="form-field"><label>Coverage Type</label><input type="text" data-field="coverage_type"></div>
      <div class="form-field"><label>Renewal Date</label><input type="date" data-field="renewal_date"></div>
      <div class="form-field"><label>Expiring Premium</label><input type="number" step="0.01" data-field="expiring_premium"></div>
      <div class="form-field"><label>Broker</label><input type="text" data-field="broker_name"></div>
    </div></div><div class="modal-footer"><button class="btn btn-secondary" data-action="close">Cancel</button><button class="btn btn-primary" data-action="create">Create</button></div></div></div>`;
    document.getElementById("modal-root").innerHTML=html;
    const ov=document.getElementById("modal-overlay");
    ov.addEventListener("click",e=>{if(e.target===ov)UI.closeModal()});
    ov.querySelectorAll("[data-action='close']").forEach(b=>b.addEventListener("click",UI.closeModal));
    ov.querySelectorAll("[data-action='create']").forEach(b=>b.addEventListener("click",async()=>{const d={};ov.querySelectorAll("[data-field]").forEach(el=>{d[el.dataset.field]=el.value});if(!d.insured_name||!d.insured_name.trim()){UI.toast("Insured Name is required","error");return}await Act.addRenewal(d)}));
  },
  closeModal(){document.getElementById("modal-root").innerHTML=""},
  initEvents(){
    document.querySelectorAll(".view-tab").forEach(t=>{t.addEventListener("click",()=>Act.setView(t.dataset.view))});
    document.querySelectorAll(".filter-btn").forEach(b=>{b.addEventListener("click",()=>Act.setFilter(b.dataset.filter))});
    document.getElementById("btn-new").addEventListener("click",()=>UI.openNewModal());
    document.getElementById("btn-theme").addEventListener("click",()=>Act.toggleTheme());
    document.getElementById("btn-backup").addEventListener("click",()=>DB.exportBackup());
    document.getElementById("btn-restore").addEventListener("click",()=>document.getElementById("file-restore").click());
    document.getElementById("btn-import").addEventListener("click",()=>document.getElementById("file-import").click());
    document.getElementById("file-restore").addEventListener("change",e=>{if(e.target.files[0])DB.importBackup(e.target.files[0]);e.target.value=""});
    document.getElementById("file-import").addEventListener("change",e=>{if(e.target.files[0])DB.importCSV(e.target.files[0]);e.target.value=""});
    document.getElementById("search-input").addEventListener("input",U.debounce(e=>{Act.setSearch(e.target.value)},200));
    document.getElementById("btn-logout").addEventListener("click",async()=>{await sb.auth.signOut();App.user=null;UI.showLogin()});
    document.addEventListener("keydown",e=>{const tag=document.activeElement.tagName;if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"){if(e.key==="Escape")document.activeElement.blur();return}if(e.key==="Escape"){UI.closeModal();return}if(e.key==="/"){e.preventDefault();document.getElementById("search-input").focus();return}if(e.key.toLowerCase()==="n"){UI.openNewModal();return}if(e.key.toLowerCase()==="t"){Act.toggleTheme();return}if(e.ctrlKey&&e.key.toLowerCase()==="d"){e.preventDefault();DB.exportBackup();return}if(e.key==="1")Act.setView("board");if(e.key==="2")Act.setView("list");if(e.key==="3")Act.setView("calendar");if(e.key==="4")Act.setView("stats")});
  }
};

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){App.user=session.user;await UI.boot()}
  else{UI.showLogin()}
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==="SIGNED_IN"&&session){App.user=session.user;await UI.boot()}
    if(event==="SIGNED_OUT"){App.user=null;UI.showLogin()}
  });
})();
</script>
</body>
</html>
